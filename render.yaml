services:
  - type: web
    name: agri-smart-dashboard
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true

    # Render will prompt you to set these values in the dashboard.
    # Do NOT put real values here — this file is committed to git.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false   # Render will ask you to fill this in the dashboard
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_LOG_WEBHOOK_URL
        value: ""     # Optional — leave blank if not using a log webhook

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
